<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platterly | Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,#ff512f,#dd2476,#6a11cb);
background-size:400% 400%;
animation:bg 10s infinite alternate;
}

@keyframes bg{
0%{background-position:left;}
100%{background-position:right;}
}

.container{
width:400px;
background:#fff;
padding:35px;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,.25);
}

.logo{
text-align:center;
font-size:34px;
font-weight:bold;
color:#ff5722;
}

.logo span{
color:#6a11cb;
}

.subtitle{
text-align:center;
margin-top:8px;
margin-bottom:25px;
color:#666;
}

.input-group{
margin-bottom:18px;
}

label{
font-weight:600;
color:#333;
}

input{
width:100%;
padding:12px;
margin-top:6px;
border-radius:10px;
border:1px solid #ccc;
outline:none;
font-size:15px;
transition:.3s;
}

input:focus{
border-color:#ff5722;
box-shadow:0 0 10px rgba(255,87,34,.2);
}

.password-box{
position:relative;
}

.password-box span{
position:absolute;
right:15px;
top:42px;
cursor:pointer;
font-weight:bold;
color:#ff5722;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#ff512f,#ff9800);
color:#fff;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.03);
}

.footer{
margin-top:18px;
text-align:center;
}

.footer a{
text-decoration:none;
color:#ff5722;
font-weight:bold;
}

.error{
color:red;
font-size:13px;
margin-top:5px;
}

@media(max-width:500px){

.container{
width:95%;
}

}

</style>

</head>
<body>

<div class="container">

<div class="logo">
🍽 Platter<span>ly</span>
</div>

<p class="subtitle">
Welcome Back! Login to Continue
</p>

<form id="loginForm" action="LoginServlet" method="post">

<div class="input-group">

<label>Email Address</label>

<input type="email"
id="email"
name="email"
placeholder="Enter Email">

<div class="error" id="emailError"></div>

</div>

<div class="input-group password-box">

<label>Password</label>

<input type="password"
id="password"
name="password"
placeholder="Enter Password">

<span onclick="togglePassword()">Show</span>

<div class="error" id="passwordError"></div>

</div>

<button type="submit">
Login
</button>

<div class="footer">

Don't have an account?

<a href="register.html">Register</a>

</div>

</form>

</div>

<script>

function togglePassword(){

let pass=document.getElementById("password");

if(pass.type==="password"){
pass.type="text";
}
else{
pass.type="password";
}

}

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

document.getElementById("emailError").innerHTML="";
document.getElementById("passwordError").innerHTML="";

let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value.trim();

let valid=true;

let emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if(!emailPattern.test(email)){
document.getElementById("emailError").innerHTML="Enter a valid email";
valid=false;
}

if(password.length<6){
document.getElementById("passwordError").innerHTML="Password must be at least 6 characters";
valid=false;
}

if(valid){
document.getElementById("loginForm").submit();
}

});

</script>

</body>
</html>
