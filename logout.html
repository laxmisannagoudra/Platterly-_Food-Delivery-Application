<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platterly - Logged Out</title>

<style>
    :root{
        --orange:#FF6B00;
        --orange-dark:#E85D00;
        --ink:#1F1B16;
        --ink-soft:#6B6058;
        --line:#EDE7DE;
        --cream:#FFFBF6;
        --green:#0A8A3F;
    }

    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}

    body{background-color:var(--cream);color:var(--ink);}

    a{text-decoration:none;color:inherit;}

    /* ================= NAV ================= */
    nav{
        background:#fff;
        height:70px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:0 6%;
        box-shadow:0 1px 0 var(--line);
        position:sticky;
        top:0;
        z-index:1000;
    }

    .logo{font-size:26px;font-weight:800;color:var(--orange);}

    .nav-links{display:flex;align-items:center;gap:30px;}
    .nav-links a{color:var(--ink);font-weight:600;font-size:14.5px;transition:color .2s;}
    .nav-links a:hover{color:var(--orange);}

    /* ================= LOGOUT PANEL ================= */
    .wrap{
        min-height:calc(100vh - 70px - 78px);
        display:flex;
        align-items:center;
        justify-content:center;
        padding:40px 6%;
        background:linear-gradient(160deg,#FFF3E6 0%, #FFE3C2 100%);
    }

    .card{
        background:#fff;
        border-radius:18px;
        box-shadow:0 18px 40px -16px rgba(31,27,22,0.28);
        padding:50px 44px;
        max-width:420px;
        width:100%;
        text-align:center;
    }

    .icon-circle{
        width:74px;height:74px;
        border-radius:50%;
        background:#FFF3E6;
        display:flex;align-items:center;justify-content:center;
        font-size:34px;
        margin:0 auto 22px;
    }

    .card h1{font-size:23px;margin-bottom:10px;color:var(--ink);}
    .card p{color:var(--ink-soft);font-size:14.5px;margin-bottom:6px;line-height:1.5;}

    #countdown{color:var(--orange);font-weight:700;}

    .card-actions{
        margin-top:28px;
        display:flex;
        flex-direction:column;
        gap:12px;
    }

    .btn-primary{
        background:var(--orange);
        color:#fff;
        border:none;
        padding:14px;
        border-radius:9px;
        font-weight:700;
        font-size:14.5px;
        cursor:pointer;
        transition:background .2s;
        display:block;
    }
    .btn-primary:hover{background:var(--orange-dark);}

    .btn-outline{
        background:#fff;
        color:var(--ink);
        border:1.5px solid var(--line);
        padding:14px;
        border-radius:9px;
        font-weight:700;
        font-size:14.5px;
        cursor:pointer;
        transition:all .2s;
        display:block;
    }
    .btn-outline:hover{border-color:var(--orange);color:var(--orange);}

    /* ================= FOOTER ================= */
    footer{
        background:var(--ink);
        color:#fff;
        text-align:center;
        padding:26px;
    }
    footer span{color:var(--orange);font-weight:700;}

    @media (max-width:640px){
        .nav-links a{display:none;}
        .card{padding:40px 26px;}
    }

    @media (prefers-reduced-motion: reduce){
        *{transition:none !important;}
    }
</style>
</head>
<body>

<!-- ================= NAV ================= -->
<nav>
    <a href="home.html" class="logo">Platterly</a>
    <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="restaurant.jsp">Restaurants</a>
    </div>
</nav>

<!-- ================= LOGOUT PANEL ================= -->
<div class="wrap">
    <div class="card">
        <div class="icon-circle">👋</div>
        <h1>You've been logged out</h1>
        <p>Your session has ended. Thanks for using Platterly!</p>
        <p>Redirecting to home in <span id="countdown">5</span> seconds...</p>

        <div class="card-actions">
            <a href="register.html" class="btn-primary">Sign In Again</a>
            <a href="home.html" class="btn-outline">Go to Home</a>
        </div>
    </div>
</div>

<!-- ================= FOOTER ================= -->
<footer>
    <p>© 2026 <span>Platterly</span> | Delicious food delivered to you</p>
</footer>

<script>
    // Clear any locally stored session data on logout
    (function clearSession() {
        try {
            localStorage.removeItem('userSession');
            localStorage.removeItem('authToken');
            sessionStorage.clear();
        } catch (e) {
            console.warn('Could not clear session storage:', e);
        }
    })();

    // Countdown redirect to home page
    let secondsLeft = 5;
    const countdownEl = document.getElementById('countdown');

    const timer = setInterval(function () {
        secondsLeft--;
        countdownEl.textContent = secondsLeft;

        if (secondsLeft <= 0) {
            clearInterval(timer);
            window.location.href = 'home.html';
        }
    }, 1000);
</script>

</body>
</html>
