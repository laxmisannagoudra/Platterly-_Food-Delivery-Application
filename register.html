<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platterly | Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#ff512f,#dd2476,#6a11cb);
    background-size:400% 400%;
    animation:bg 10s infinite alternate;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

@keyframes bg{
0%{background-position:left;}
100%{background-position:right;}
}

.container{
    width:420px;
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:0 20px 40px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    color:#ff5722;
}

.logo span{
    color:#6a11cb;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-top:5px;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

label{
    font-weight:600;
    color:#333;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:6px;
    border-radius:10px;
    border:1px solid #ccc;
    outline:none;
    font-size:15px;
    transition:.3s;
}

input:focus,select:focus{
    border-color:#ff5722;
    box-shadow:0 0 10px rgba(255,87,34,.2);
}

.password-box{
    position:relative;
}

.password-box span{
    position:absolute;
    right:15px;
    top:42px;
    cursor:pointer;
    font-size:14px;
    color:#ff5722;
    font-weight:bold;
}

.checkbox{
    display:flex;
    align-items:center;
    margin-top:15px;
    margin-bottom:20px;
}

.checkbox input{
    width:auto;
    margin-right:10px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#ff512f,#ff9800);
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.4s;
}

button:hover{
    transform:scale(1.03);
}

.footer{
    text-align:center;
    margin-top:18px;
}

.footer a{
    color:#ff5722;
    text-decoration:none;
    font-weight:bold;
}

.error{
    color:red;
    font-size:13px;
    margin-top:5px;
}

.success{
    color:green;
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

@media(max-width:500px){

.container{
width:95%;
}

}
</style>

</head>
<body>

<div class="container">

<div class="logo">
🍽 Platter<span>ly</span>
</div>

<p class="subtitle">Create Your Account</p>

<form id="registerForm" action="RegisterServlet" method="post">
<div class="input-group">
<label>Full Name</label>
<input type="text" id="name" name="fullName" placeholder="Enter Full Name">
<div class="error" id="nameError"></div>
</div>

<div class="input-group">
<label>Email Address</label>
<input type="email" id="email" name="email" placeholder="Enter Email">
<div class="error" id="emailError"></div>
</div>

<div class="input-group">
<label>Phone Number</label>
<input type="text"
       id="phone"
       name="phone"
       maxlength="10"
       placeholder="Enter Mobile Number">
<div class="error" id="phoneError"></div>
</div>

<div class="input-group">
<label>Address</label>
<input type="text" id="address" name="address" placeholder="Enter Address">
<div class="error" id="addressError"></div>
</div>

<div class="input-group">
<label>Select Role</label>

<select id="role" name="role">
<option value="">Choose Role</option>
<option value="Customer">Customer</option>
<option value="RestaurantAdmin">RestaurantAdmin</option>
<option value="Admin">Admin</option>

</select>

<div class="error" id="roleError"></div>

</div>

<div class="input-group password-box">
<label>Password</label>
<input type="password" id="password" name="password" placeholder="Enter Password">
<span onclick="togglePassword()">Show</span>
<div class="error" id="passwordError"></div>
</div>

<div class="input-group">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password">
<div class="error" id="confirmError"></div>
</div>

<div class="checkbox">
<input type="checkbox" id="terms">
<label>I agree to Terms & Conditions</label>
</div>

<div class="error" id="termsError"></div>

<button type="submit">
Create Account
</button>

<div class="success" id="success"></div>

<div class="footer">
Already have an account?
<a href="login.html">Login</a>
</div>

</form>

</div>

<script>

function togglePassword(){

let pass=document.getElementById("password");

if(pass.type==="password"){
pass.type="text";
}
else{
pass.type="password";
}

}

document.getElementById("registerForm").addEventListener("submit",function(e){

e.preventDefault();

document.querySelectorAll(".error").forEach(x=>x.innerHTML="");
document.getElementById("success").innerHTML="";

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let phone=document.getElementById("phone").value.trim();
let address=document.getElementById("address").value.trim();
let role=document.getElementById("role").value;
let password=document.getElementById("password").value;
let confirm=document.getElementById("confirmPassword").value;
let terms=document.getElementById("terms").checked;

let valid=true;

if(name===""){
document.getElementById("nameError").innerHTML="Enter Full Name";
valid=false;
}

let emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if(!emailPattern.test(email)){
document.getElementById("emailError").innerHTML="Invalid Email";
valid=false;
}

let phonePattern=/^[6-9][0-9]{9}$/;

if(!phonePattern.test(phone)){
document.getElementById("phoneError").innerHTML="Invalid Mobile Number";
valid=false;
}

if(address===""){
document.getElementById("addressError").innerHTML="Enter Address";
valid=false;
}

if(role===""){
document.getElementById("roleError").innerHTML="Select Role";
valid=false;
}

if(password.length<6){
document.getElementById("passwordError").innerHTML="Minimum 6 Characters";
valid=false;
}

if(password!==confirm){
document.getElementById("confirmError").innerHTML="Passwords do not Match";
valid=false;
}

if(!terms){
document.getElementById("termsError").innerHTML="Accept Terms & Conditions";
valid=false;
}

if(valid){
    document.getElementById("registerForm").submit();
    
}

});

</script>

</body>
</html>
